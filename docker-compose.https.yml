# Valfritt: automatisk HTTPS med ett gratis certifikat.
# 1. Peka ett domännamn (till exempel lunch.minskola.se) mot din server.
# 2. Byt ut "lunch.myschool.se" nedan mot ditt domännamn.
# 3. Kör: docker compose -f docker-compose.https.yml up -d
services:
  lunchlada:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from lunch.myschool.se --to lunchlada:3000
    volumes:
      - caddy_data:/data
volumes:
  caddy_data:
